# Every push and pull request: lint, the unit tests, and a type report. Hardware-free, like
# ./run_tests.sh on the Pi.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # As on the Pi (docs/setup.md): dbus comes from apt, not pip, and the venv sees it.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dbus

      - name: Python environment
        run: |
          python3 -m venv --system-site-packages venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements-dev.txt

      - name: Lint
        run: venv/bin/ruff check .

      - name: Tests
        run: ./run_tests.sh

      - name: Types (informational)
        continue-on-error: true
        run: venv/bin/mypy
